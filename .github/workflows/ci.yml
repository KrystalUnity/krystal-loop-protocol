name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline worker and critic tests
        run: python3 examples/openai-compatible-critic/tests/test_critic.py -v
      - name: Run fail-review-repair lifecycle fixture
        run: python3 examples/fail-review-repair/tests/test_fixture.py -v
      - name: Check protocol documentation and local links
        run: python3 tests/test_v03_documentation.py -v
      - name: Run capability gate and recovery fixtures
        run: python3 -m unittest discover -s examples/capability-regression/tests -v
      - name: Install offline audit isolation dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Verify deterministic capability audit runner
        run: |
          # Hosted runners can deny unprivileged network-namespace setup.
          # Elevate this offline fixture only; probes still drop all capabilities.
          sudo -n bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 /usr/bin/true
          sudo -n env -i PATH=/usr/local/bin:/usr/bin:/bin /bin/bash -eu <<'SH'
          # After capabilities are dropped, namespace root cannot traverse the
          # runner user's private home. Test identical bytes from its own temp dir.
          audit_dir="$(mktemp -d)"
          trap 'rm -rf -- "$audit_dir"' EXIT
          cp -R examples/capability-audit/. "$audit_dir/"
          /usr/bin/python3 -m unittest discover -s "$audit_dir/tests" -v
          SH
      - name: Verify published receipt arithmetic
        run: |
          python3 case-studies/krystalview-2026-10-20/verify.py
          python3 case-studies/semio-coordination-2026-10-20/verify.py
      - name: Check launcher syntax
        run: bash -n examples/deepseek-codex-worker/run.sh
      - name: Check optional Semio adapter offline
        run: python3 -m unittest discover -s examples/semio-coordination/tests -v
      - name: Check critic syntax
        run: |
          python3 -m py_compile examples/openai-compatible-critic/critic.py
          python3 -m py_compile examples/fail-review-repair/run_fixture.py
      - name: Validate JSON examples
        run: |
          python3 -m json.tool examples/openai-compatible-critic/review-packet.example.json >/dev/null
          python3 -m json.tool examples/openai-compatible-critic/verdict.schema.json >/dev/null
          python3 -m json.tool examples/deepseek-codex-worker/expected-handover.json >/dev/null
